<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0}</style>

<text x="1090" y="1178" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">one change per wave</text>

<path d="M800 1150 L892 1150" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>

<path d="M1010 1560 L1010 1655" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>

<rect x="850" y="1665" width="320" height="145" rx="16" fill="#F7DCCE" stroke="#C25E3F" stroke-width="3"/>

<text x="1010" y="1781" text-anchor="middle" font-size="27" font-weight="500" fill="#C25E3F">Report + best config</text>
