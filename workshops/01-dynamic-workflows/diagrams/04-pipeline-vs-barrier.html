<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0}</style>

<rect width="2000" height="1360" fill="#E9E8E1"/>

<rect x="1142" y="530" width="212" height="58" rx="10" fill="#F7DCCE" stroke="#C25E3F" stroke-width="2.5"/>

<text x="1478" y="368" font-size="24" fill="#55554F" font-family="'SF Mono', Menlo, monospace">all done &#183; t=10</text>

<text x="360" y="916" text-anchor="end" font-size="28" fill="#4A4A44">Item B</text>

<line x1="1036" y1="762" x2="1036" y2="1052" stroke="#55554F" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="1036" y="752" text-anchor="middle" font-size="22" fill="#55554F" font-family="'SF Mono', Menlo, monospace">barrier</text>
<line x1="1566" y1="762" x2="1566" y2="1052" stroke="#55554F" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="1566" y="752" text-anchor="middle" font-size="22" fill="#55554F" font-family="'SF Mono', Menlo, monospace">barrier</text>

<!-- finish line t=13 -->
<line x1="1778" y1="762" x2="1778" y2="1052" stroke="#55554F" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="1778" y="752" text-anchor="middle" font-size="22" fill="#55554F" font-family="'SF Mono', Menlo, monospace">t=13</text>

<!-- takeaway -->
<text x="1000" y="1130" text-anchor="middle" font-size="29" fill="#44443F">Same work, same agents &#8212; the two barriers alone add 3 units of wall-clock.</text>
