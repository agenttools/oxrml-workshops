<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0}</style>
<svg width="2000" height="1340" viewBox="0 0 2000 1340" xmlns="http://www.w3.org/2000/svg"

<defs>

</marker>
</defs>
<rect width="2000" height="1340" fill="#E9E8E1"/>

<text x="730" y="623" text-anchor="middle" font-size="32" font-weight="500" fill="#33332F">Finder 1</text>
<text x="730" y="659" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">correctness</text>

<text x="730" y="753" text-anchor="middle" font-size="32" font-weight="500" fill="#33332F">Finder 2</text>
<text x="730" y="789" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">security</text>
<rect x="560" y="835" width="340" height="110" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>
<text x="730" y="883" text-anchor="middle" font-size="32" font-weight="500" fill="#33332F">Finder 3</text>
<text x="730" y="919" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">performance</text>
</g>

<!-- converge to dedup -->
<path d="M900 630 C990 630 1030 720 1068 747" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>
<path d="M900 760 L1068 760" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>
<path d="M900 890 C990 890 1030 800 1068 773" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>

<rect x="1080" y="695" width="360" height="130" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>
<text x="1260" y="752" text-anchor="middle" font-size="32" font-weight="500" fill="#33332F">Dedup</text>
<text x="1260" y="790" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">drop already-seen</text>

<!-- Out -->
<rect x="1475" y="1060" width="250" height="150" rx="16" fill="#F7DCCE" stroke="#C25E3F" stroke-width="3"/>
<text x="1600" y="1131" text-anchor="middle" font-size="40" font-weight="600" fill="#262624">Out</text>
<text x="1600" y="1179" text-anchor="middle" font-size="27" font-weight="500" fill="#C25E3F">Everything found</text>
</svg>
