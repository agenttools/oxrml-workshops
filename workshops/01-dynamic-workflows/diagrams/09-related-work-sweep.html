<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0}</style>
<svg width="2000" height="1810" viewBox="0 0 2000 1810" xmlns="http://www.w3.org/2000/svg"

<defs>

<rect width="2000" height="1810" fill="#E9E8E1"/>

<text x="505" y="366" text-anchor="middle" font-size="27" font-weight="500" fill="#C25E3F">Your paper's topic</text>

<path d="M505 395 C860 425 1440 472 1558 550" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>

<rect x="340" y="565" width="300" height="105" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>

<text x="490" y="646" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">by keyword</text>
<rect x="700" y="565" width="300" height="105" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>
<text x="850" y="611" text-anchor="middle" font-size="31" font-weight="500" fill="#33332F">Searcher 2</text>
<text x="850" y="646" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">by authors</text>
<rect x="1060" y="565" width="300" height="105" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>
<text x="1210" y="611" text-anchor="middle" font-size="31" font-weight="500" fill="#33332F">Searcher 3</text>
<text x="1210" y="646" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">by citation graph</text>
<rect x="1420" y="565" width="300" height="105" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>
<text x="1570" y="611" text-anchor="middle" font-size="31" font-weight="500" fill="#33332F">Searcher 4</text>
<text x="1570" y="646" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">by venue &amp; year</text>
</g>

<!-- converge searchers -> dedup -->
<path d="M490 670 C540 770 800 800 918 821" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>

<!-- dedup (plain code, oat) -->

<text x="1010" y="885" text-anchor="middle" font-size="31" font-weight="500" fill="#33332F">Dedup</text>
<text x="1010" y="921" text-anchor="middle" font-size="21" fill="#97783A" font-family="'SF Mono', Menlo, monospace">vs papers already read</text>

<rect x="300" y="1015" width="1460" height="460" rx="30" fill="#DAE8D8" stroke="#6FA37C" stroke-width="3"/>

<path d="M1010 955 L1010 1085" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>

<!-- deep reader -->
<rect x="810" y="1095" width="400" height="120" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>
<text x="1010" y="1147" text-anchor="middle" font-size="31" font-weight="500" fill="#33332F">Deep reader</text>
<text x="1010" y="1183" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">true relevance, per paper</text>

<!-- reader -> critic -->
<path d="M1010 1215 L1010 1270" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>

<!-- completeness critic -->
<rect x="810" y="1280" width="400" height="120" rx="12" fill="#F1F1EB" stroke="#85857D" stroke-width="3"/>
<text x="1010" y="1332" text-anchor="middle" font-size="31" font-weight="500" fill="#33332F">Completeness critic</text>
<text x="1010" y="1368" text-anchor="middle" font-size="21" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">which subfield is missing?</text>

<!-- critic loop back to searchers -->
<path d="M810 1340 L272 1340 Q250 1340 250 1320 L250 637 Q250 617 270 617 L328 617"
      fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>
<text x="530" y="1320" text-anchor="middle" font-size="22" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">named gaps &#8594; new queries</text>

<!-- to Out -->
<path d="M1010 1400 L1010 1545" fill="none" stroke="#8A8A82" stroke-width="3.5" stroke-dasharray="11 10" marker-end="url(#arr)"/>
<text x="1038" y="1508" font-size="22" fill="#8A8A80" font-family="'SF Mono', Menlo, monospace">no gaps left &#8594; done</text>

<!-- Out -->
<rect x="885" y="1555" width="250" height="145" rx="16" fill="#F7DCCE" stroke="#C25E3F" stroke-width="3"/>
<text x="1010" y="1623" text-anchor="middle" font-size="40" font-weight="600" fill="#262624">Out</text>
<text x="1010" y="1671" text-anchor="middle" font-size="27" font-weight="500" fill="#C25E3F">A defensible map</text>
</svg>
